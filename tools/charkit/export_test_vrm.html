// ───────── 共通：T ポーズ（腕を横へ）にした時の骨の世界の位置・回転 ─────────
/** 手続きの骨（腕を下ろした休みの姿勢）を T ポーズにする。戻り値：{ Wq: 名前 → 世界の回転（T）, Wp: 名前 → 世界の位置（T） } */

const isHelper = (m, n) => (m.helpers || []).some(h => h[0] === n);
const isWeapon = n => /^w[A-Z]/.test(n);

/** 書き出す骨の表（助けの骨・武器の骨を除く。揺れ物の鎖の先に _end を足す） */
function boneTable(m, T) {
  const keep = m.skeleton.bones.filter(b => !isHelper(m, b.name) && !isWeapon(b.name));
  const index = new Map(keep.map((b, i) => [b.name, i]));
  const out = keep.map(b => {
    const p = b.parent && index.has(b.parent.name) ? b.parent.name : null;
    const w = T.Wp[b.name], pw = p ? T.Wp[p] : V();
    return { name: b.name, parent: p ? index.get(p) : -1, pos: [w.x - pw.x, w.y - pw.y, w.z - pw.z] };
  });

  for (const ch of m.springs.chains) {
    const last = ch.joints[ch.joints.length - 1].b;
    const tail = ch.tail ? V(...ch.tail) : last.position.clone();
    tail.applyQuaternion(T.Wq[last.name]);
    out.push({ name: last.name + '_end', parent: index.get(last.name), pos: [tail.x, tail.y, tail.z] });
    index.set(last.name + '_end', out.length - 1);

/** 皮の重みの付け替え：助けの骨 → 親の骨と元の関節に半分ずつ。武器の骨 → 捨てる（-1） */
function weightMapper(m, idx) {

  const H = new Map((m.helpers || []).map(h => [h[0], h]));
  return (bi, w, acc) => {
    const b = bones[bi]; if (!b || w <= 0) return true;
    if (isWeapon(b.name)) return false;
    if (H.has(b.name)) { const [, src, k] = H.get(b.name); const par = b.parent.name; acc[idx.get(par)] = (acc[idx.get(par)] || 0) + w * (1 - k); acc[idx.get(src)] = (acc[idx.get(src)] || 0) + w * k; return true; }
    acc[idx.get(b.name)] = (acc[idx.get(b.name)] || 0) + w; return true;
  };

/** 網の頂点を T ポーズへ焼き、重みを付け替える。戻り値：{ pos, nrm, col, uv, joints, weights, drop:Uint8Array, mcls } */
function bakeMesh(m, mesh, idx) {

/** 三角形の組（材質の種類ごと）を 1 つの primitive にする（使う頂点だけ・番号を振り直す） */
function subPrim(bk, tris, material, extra = {}) {

}

// ───────── 顔：表情ごとの絵（1024²）と、部品を写した網＋モーフ ─────────
const FACE_BLOCKS = { neutral: [0, 0], happy: [512, 0], angry: [0, 256], sad: [512, 256], surprised: [0, 512], relaxed: [512, 512], closed: [0, 768] };
const EXPR_SRC = { happy: 'smile', angry: 'angry', sad: 'sad', surprised: 'surprised', relaxed: 'calm' };
/** 目の 3 層（白目の形・虹彩・まぶた）を 1 枚に重ねる（シェーダーでしていた事を絵で） */
function composeEye(src) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.drawImage(src, 384, 0, 128, 128, 0, 0, 128, 128);
  g.globalCompositeOperation = 'source-atop'; g.drawImage(src, 256, 0, 128, 128, 0, 0, 128, 128);
  g.globalCompositeOperation = 'source-over'; g.drawImage(src, 0, 0, 128, 128, 0, 0, 128, 128);
  return c;
}
function faceAtlasBig(m) {
  const tex = m.faceTex, src = tex.userData.canvas;
  const big = document.createElement('canvas'); big.width = big.height = 1024; const G = big.getContext('2d');
  const put = (name, exprName) => {
    tex.userData.setExpr(exprName);
    const [bx, by] = FACE_BLOCKS[name];
    G.drawImage(src, 0, 0, 512, 256, bx, by, 512, 256);
    G.clearRect(bx, by, 128, 128); G.drawImage(composeEye(src), bx, by);
  };
  put('neutral', 'neutral'); for (const [k, e] of Object.entries(EXPR_SRC)) put(k, e);
  tex.userData.setExpr('neutral');

  { const [bx, by] = FACE_BLOCKS.closed; G.save(); G.translate(bx, by); G.strokeStyle = '#22122e'; G.lineWidth = 7; G.lineCap = 'round';
    G.beginPath(); G.moveTo(16, 66); G.quadraticCurveTo(64, 84, 110, 70); G.stroke(); G.lineWidth = 3; G.beginPath(); G.moveTo(18, 66); G.lineTo(8, 60); G.stroke(); G.restore(); }

}
const atlasPx = (u, v) => [u * 512, (1 - v) * 256];          // 元の地図帳（flipY：v＝1 が上）→ 画素
const toBig = (px, py, block) => [(block[0] + px) / 1024, (block[1] + py) / 1024];   // glTF の uv（左上が 0）

function faceParts(bk) {
  // 部品（デカール）＝つながった三角形の組
  const n = bk.n, par = new Int32Array(n).map((_, i) => i);
  const f = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  for (let t = 0; t < bk.index.length; t += 3) { const a = f(bk.index[t]), b = f(bk.index[t + 1]), c = f(bk.index[t + 2]); par[b] = a; par[c] = a; par[f(b)] = a; }
  const groups = new Map();
  for (let i = 0; i < n; i++) { const r = f(i); if (!groups.has(r)) groups.set(r, { verts: [], tris: [] }); groups.get(r).verts.push(i); }
  for (let t = 0; t < bk.index.length; t += 3) groups.get(f(bk.index[t])).tris.push([bk.index[t], bk.index[t + 1], bk.index[t + 2]]);

  for (const g of groups.values()) {

    parts.push(Object.assign(g, { kind, side: x >= 0 ? 'L' : 'R', center: c }));

}

function buildFace(bk, faceMaterial) {

  const TG = {};                          // モーフの名前 → Map(頂点番号 → 差分)
  const targetNames = ['blinkL', 'blinkR', 'aa', 'ih', 'ou', 'ee', 'oh', 'happy', 'angry', 'sad', 'surprised', 'relaxed'];
  for (const t of targetNames) TG[t] = new Map();

    const map = new Map();
    for (const i of part.verts) {
      const j = P.length / 3; map.set(i, j);
      const p = collapsed ? part.center : V(bk.pos[i * 3], bk.pos[i * 3 + 1], bk.pos[i * 3 + 2]);
      P.push(p.x, p.y, p.z); N.push(bk.nrm[i * 3], bk.nrm[i * 3 + 1], bk.nrm[i * 3 + 2]);
      const [px, py] = atlasPx(bk.uv[i * 2], bk.uv[i * 2 + 1]); const [u, v] = uvOf(px, py); UVo.push(u, v);
      for (let k = 0; k < 4; k++) { J.push(bk.joints[i * 4 + k]); W.push(bk.weights[i * 4 + k]); }
    }

    const nm = 'blink' + part.side;
    delta(part, base.get(part), nm, -1);

  for (const part of parts.filter(p => p.kind === 'mouth')) for (const [vis, s] of Object.entries(SLOT)) {

    delta(part, base.get(part), ex, -1);
    const mp = addPart(part, (px, py) => toBig(px, py, FACE_BLOCKS[ex]), true); delta(part, mp, ex, 1);

  return { prim, targetNames, counts: { parts: parts.length, eyes: parts.filter(p => p.kind === 'eye').length, mouth: parts.filter(p => p.kind === 'mouth').length, brows: parts.filter(p => p.kind === 'brow').length, verts: nv } };
}

// ───────── VRM 1.0 ─────────

    expressions, firstPerson: [{ mesh: 0, type: 'auto' }, { mesh: 1, type: 'thirdPersonOnly' }],
    lookAt: { offsetFromHeadBone: [0, eyeL.y - head.y, eyeL.z - head.z], type: 'bone', rangeMapHorizontalInner: range(90, 9), rangeMapHorizontalOuter: range(90, 9), rangeMapVerticalDown: range(90, 7), rangeMapVerticalUp: range(90, 7) },
    springs, colliders, colliderGroups: [{ name: 'body', colliders: colliders.map((_, i) => i) }],
  });
  return { glb, info: { bones: bones.length, prims: prims.length + 1, droppedTris: dropped, face: F.counts, tris: prims.reduce((s, p) => s + p.index.length / 3, 0) + F.prim.index.length / 3, png: png.byteLength, hipsY: T.Wp.hips.y, T, bonesTable: bones } };
}

// ───────── VRMA：手続きの動きを録る ─────────
/** 録る時の人型の 17 本（T ポーズの骨）。VRM と同じ位置 */
function vrmaSkeleton(T) {
  const bones = HUMAN17.map(n => ({ name: n }));
  const ix = new Map(HUMAN17.map((n, i) => [n, i]));
  const PAR = { hips: null, spine: 'hips', chest: 'spine', neck: 'chest', head: 'neck', leftUpperArm: 'chest', leftLowerArm: 'leftUpperArm', leftHand: 'leftLowerArm', rightUpperArm: 'chest', rightLowerArm: 'rightUpperArm', rightHand: 'rightLowerArm', leftUpperLeg: 'hips', leftLowerLeg: 'leftUpperLeg', leftFoot: 'leftLowerLeg', rightUpperLeg: 'hips', rightLowerLeg: 'rightUpperLeg', rightFoot: 'rightLowerLeg' };
  bones.forEach(b => { const p = PAR[b.name]; const w = T.Wp[b.name], pw = p ? T.Wp[p] : V(); b.parent = p ? ix.get(p) : -1; b.pos = [w.x - pw.x, w.y - pw.y, w.z - pw.z]; });
  const HB = {}; HUMAN17.forEach((n, i) => { HB[n] = i; });
  return { bones, HB, ix };
}
/** 手続きの骨の今の姿勢 → T ポーズの骨の回転（tpose.js の toTPose）と腰の位置 */
function grab(J, T) {
  const out = {};
  for (const n of HUMAN17) out[n] = tpConv.toT(n, J[n].quaternion, T.Wq).toArray();
  out._hips = J.hips.position.toArray();
  return out;
}
function makePlayer(weapon = 'none') {
  const m = buildDannoura();
  const P = new Player(m, { owned: weapon === 'none' ? [] : [weapon], weapon });
  P.yaw = 0; P.pos.set(0, 0, 0);
  return { m, P, F: P.fighter };
}
function step(P, F, v, I = {}) {
  F.tick(I);
  const moved = v * DT; P.pos.z += moved; P.speed = v; P.moveDir = { x: 0, z: 1 };
  P.advance(moved, v); P.animate(DT);
}
const slerpArr = (a, b, t) => new THREE.Quaternion().fromArray(a).slerp(new THREE.Quaternion().fromArray(b), t).toArray();
const lerpArr = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);

/** 歩きの周期を 1 つ録り、位相で等間隔の K こまに並べ直す（u＝0 が左のかかとの着地） */
function recordCycle(T, v, K = 32) {
  const { m, P, F } = makePlayer('none');
  for (let i = 0; i < 240; i++) step(P, F, v);
  // 位相をほどいた値（u：周期の数）で録り、u＝整数（左のかかとの着地）から 1 周を等間隔の K こまに並べ直す（どの速さのクリップも u＝0 がそろう）
  const fr = []; const ph0 = P.phase;
  while (fr.length < 2000) { step(P, F, v); const u = (P.phase - ph0) / (2 * Math.PI) + ph0 / (2 * Math.PI); fr.push({ u, g: grab(m.J, T) }); if (u > Math.floor(fr[0].u) + 2.05) break; }
  const base = Math.floor(fr[0].u) + 1;
  const sample = target => {
    let i = 0; while (i < fr.length - 2 && fr[i + 1].u < target) i++;
    const a = fr[i], b = fr[i + 1], t = Math.max(0, Math.min(1, (target - a.u) / Math.max(1e-6, b.u - a.u)));
    const o = {}; for (const n of HUMAN17) o[n] = slerpArr(a.g[n], b.g[n], t); o._hips = lerpArr(a.g._hips, b.g._hips, t); return o;
  };
  const keys = []; for (let k = 0; k < K; k++) keys.push(sample(base + k / K));
  keys.push(keys[0]);
  const cycleM = 2 * Math.PI / P.phaseRate(v), dur = cycleM / v;
  return { keys, dur, cycleM };
}
function recordIdle(T, secs = 4, fps = 30) {
  const { m, P, F } = makePlayer('none');
  for (let i = 0; i < 90; i++) step(P, F, 0);
  const fr = []; const per = Math.round(60 / fps);
  for (let i = 0; i < secs * 60; i++) { step(P, F, 0); if (i % per === 0) fr.push(grab(m.J, T)); }
  // 継ぎ目：最後の 0.6 秒を最初のこまへ寄せる（ループ）
  const nB = Math.round(0.6 * fps);
  for (let k = 0; k < nB; k++) { const i = fr.length - nB + k, t = (k + 1) / nB; for (const n of HUMAN17) fr[i][n] = slerpArr(fr[i][n], fr[0][n], t * t * (3 - 2 * t)); fr[i]._hips = lerpArr(fr[i]._hips, fr[0]._hips, t); }
  fr.push(fr[0]);
  return { keys: fr, dur: secs, fps };
}
/** 戦闘の動き：入力を入れて、その状態の間を 60Hz で録る */
function recordAction(T, weapon, kind) {
  const { m, P, F } = makePlayer(weapon);
  for (let i = 0; i < 90; i++) step(P, F, 0);
  const fr = []; let st = null, meta = null;
  if (kind === 'hurt') { F._go('hurt'); st = 'hurt'; }
  for (let i = 0; i < 300; i++) {
    const I = kind === 'light' && i === 0 ? { attack: true } : kind === 'heavy' && i < 40 ? { heavy: true } : {};
    step(P, F, 0, I);
    const s = F.st;
    if (kind === 'hurt') { if (s.name !== 'hurt') break; fr.push(grab(m.J, T)); meta = meta || { total: COMBAT.hurt.stun }; continue; }
    if (s.name === 'attack') {
      if (!meta) meta = { startup: s.atk.startup, active: s.atk.active, recovery: s.atk.recovery, step: s.step, heavy: !!s.heavy };
      fr.push(grab(m.J, T));
    } else if (meta) break;
  }
  return { keys: fr, fps: 60, meta };
}
function toVRMA(name, sk, keys, times, extras) {
  const rot = {}; HUMAN17.forEach((n, i) => { const a = new Float32Array(keys.length * 4); keys.forEach((k, j) => a.set(k[n], j * 4)); rot[i] = a; });
  const hips = new Float32Array(keys.length * 3); keys.forEach((k, j) => hips.set(k._hips, j * 3));
  return buildVRMA({ name, bones: sk.bones, humanBones: sk.HB, times: new Float32Array(times), rotations: rot, hipsTranslation: hips, extras });
}

async function exportClips(T) {
  const sk = vrmaSkeleton(T);
  const files = {}, set = { spec: 'wakaba-clipset/1', test: true, skeleton: 'vrm1-humanoid', note: '配管の試験用（コードで組んだ手続きの動きを録った物）。本番の動きは VRoid／モーションキャプチャ（docs/shinshoku/VROID_GUIDE.md）', clips: {} };
  const LOCO = [['loco.walk', COMBAT.move.walk], ['loco.jog', 3.4], ['loco.run', COMBAT.move.run], ['loco.sprint', 6.5]];
  for (const [id, v] of LOCO) {
    const c = recordCycle(T, v);
    const times = c.keys.map((_, k) => k / (c.keys.length - 1) * c.dur);
    const file = id.replace('.', '_') + '.vrma';
    files[file] = toVRMA(id, sk, c.keys, times, { wakaba: { id, test: true } });
    set.clips[id] = { file, role: 'loco', loop: true, speedMS: +v.toFixed(3), durationS: +c.dur.toFixed(4), strideM: +(c.cycleM / 2).toFixed(4), rootMotion: 'none', events: [{ t: 'footL', u: 0 }, { t: 'footR', u: 0.5 }], source: { type: 'procedural_capture', from: 'shinshoku/actor/actors.js Player（LocoDriver）' } };
  }
  {
    const c = recordIdle(T);
    const times = c.keys.map((_, k) => k / c.fps);
    files['idle.vrma'] = toVRMA('idle', sk, c.keys, times, { wakaba: { id: 'idle', test: true } });
    set.clips.idle = { file: 'idle.vrma', role: 'idle', loop: true, durationS: +(times[times.length - 1]).toFixed(4), rootMotion: 'none', source: { type: 'procedural_capture' } };
  }
  for (const [id, w, kind, ref] of [['cmb_katana_light_1', 'katana', 'light', 'katana.light[0]'], ['cmb_katana_heavy', 'katana', 'heavy', 'katana.heavy'], ['react_hit_front', 'none', 'hurt', null]]) {
    const c = recordAction(T, w, kind);
    if (!c.keys.length) { log('録れなかった：' + id); continue; }
    const times = c.keys.map((_, k) => k / c.fps);
    const file = id + '.vrma';
    const mt = c.meta || {};
    const events = mt.startup != null ? [{ t: 'hitStart', frame: mt.startup }, { t: 'hitEnd', frame: mt.startup + mt.active }] : [];
    files[file] = toVRMA(id, sk, c.keys, times, { wakaba: { id, test: true, events } });
    set.clips[id] = Object.assign({ file, role: kind === 'hurt' ? 'hit' : 'attack', loop: false, fps: 60, frames: c.keys.length, events, rootMotion: 'none', source: { type: 'procedural_capture' } },
      kind === 'hurt' ? {} : { match: { weapon: w, heavy: kind === 'heavy', step: kind === 'heavy' ? null : 0 }, combatRef: { file: 'shinshoku/data/combat.js', path: 'COMBAT.' + ref } });
  }
  return { files, set };
}

window.exportAll = async () => {
  const t0 = performance.now();
  const v = await exportVRM();
  const c = await exportClips(v.info.T);
  delete v.info.T; delete v.info.bonesTable;
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const out = { vrm: b64(v.glb), info: v.info, clips: Object.fromEntries(Object.entries(c.files).map(([k, u]) => [k, b64(u)])), set: c.set, ms: Math.round(performance.now() - t0) };
  log(JSON.stringify(out.info) + '\nclips ' + Object.keys(out.clips).join(' '));
  return out;
};
window.__ready = true;
</script>
