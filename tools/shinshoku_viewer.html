<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境界侵食 キャラクター確認</title>
<!-- 開発用：コードで組んだキャラクター／manifest で差し替えたモデルを並べて見る。?c=dannoura&pose=idle&rot=0.4&dist=1.6&y=1.45
     追加（charkit P12）：&light=day|night|back|indoor（陰影の 4 場面）・&expr=smile・&say=こんにちは（文字の口）・&gaze=0.8,0・&w=katana（持つ武器）・&t=秒（時間を進める）・&charModel=1／&charShader=1（前の版） -->
<style>html,body{margin:0;height:100%;background:#1a1626;color:#eee;font:13px sans-serif;overflow:hidden}#info{position:fixed;left:8px;top:6px;white-space:pre}</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three-esm/three-0.185.1/three.module.min.js", "three/addons/": "../vendor/three-esm/three-0.185.1/addons/", "@pixiv/three-vrm": "../vendor/three-esm/three-vrm-3.5.5/three-vrm.module.min.js" } }
</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { buildDannoura, buildCompanion, buildKiro, buildHeiten, buildShuuyou, buildCivilian } from '../shinshoku/actor/models.js';
import { buildDannouraWhite } from '../shinshoku/actor/models3.js';
import { buildDaughter } from '../shinshoku/actor/models7.js';
import { FaceDriver, codeFaceAdapter } from '../charkit/face/driver.js';
import { Poser } from '../shinshoku/actor/rig.js';
import * as A from '../shinshoku/actor/anim.js';
import { loadManifest, loadCharacter } from '../shinshoku/actor/vrm.js';
const Q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true;
const scene = new THREE.Scene();
const LIGHT = Q.get('light') || 'studio';
const LP = { studio: { hemi: [0x8a8ac0, 0x302838, 1.4], key: [0xfff0e8, 1.6, [2, 4, 3]], rim: [0x9a8aff, 1.0, [-3, 2, -3]], bg: 0x221c30 },
  day: { hemi: [0xbcd0ff, 0x6a6050, 1.5], key: [0xfff4e0, 2.4, [3, 5, 2]], rim: [0xffffff, 0.4, [-3, 2, -3]], bg: 0x8aa8d0 },
  night: { hemi: [0x5a5a9a, 0x1a1420, 1.1], key: [0x9aa8e0, 0.9, [-2, 6, 2]], rim: [0xc8b8ff, 0.0, [0, 0, 0]], bg: 0x0c0a16, point: [0xc8b8ff, 1.4, [1.2, 1.9, 1.6]], fog: 0x100c1c },
  back: { hemi: [0x40406a, 0x141018, 0.9], key: [0xffd0a0, 2.6, [-1, 3, -4]], rim: [0xff9ad0, 0.0, [0, 0, 0]], bg: 0x2a1a2a },
  indoor: { hemi: [0xffe8c8, 0x403028, 1.0], key: [0xffe0b0, 0.4, [1, 5, 1]], rim: [0, 0, [0, 1, 0]], bg: 0x2a2018, point: [0xffd8a0, 2.2, [0.6, 2.4, 0.8]] } }[LIGHT];
scene.add(new THREE.HemisphereLight(LP.hemi[0], LP.hemi[1], LP.hemi[2]));
const key = new THREE.DirectionalLight(LP.key[0], LP.key[1]); key.position.set(...LP.key[2]); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(LP.rim[0], LP.rim[1]); rim.position.set(...LP.rim[2]); scene.add(rim);
if (LP.point) { const p = new THREE.PointLight(LP.point[0], LP.point[1], 5, 1.5); p.position.set(...LP.point[2]); scene.add(p); }
if (LP.fog) scene.fog = new THREE.FogExp2(LP.fog, 0.045);
scene.background = new THREE.Color(LP.bg);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 32), new THREE.MeshToonMaterial({ color: 0x3a3446 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
const builders = { dannoura: buildDannoura, companion: buildCompanion, kiro: () => buildKiro(0xd04848), heiten: buildHeiten, shuuyou: buildShuuyou, civilian: () => buildCivilian(3), white: buildDannouraWhite, mixed: () => buildDannouraWhite({ mixed: true }), daughter: buildDaughter };
const list = (Q.get('c') || 'dannoura,companion,kiro,heiten,shuuyou').split(',');
const actors = [];
const man = Q.get('manifest') === '1' ? await loadManifest() : null;
let x = -(list.length - 1) * 0.55;
for (const n of list) {
  let m = null;
  if (man && man.characters && man.characters[n] && man.characters[n].file) m = await loadCharacter(man.characters[n]);
  if (!m) m = builders[n]();
  const g = new THREE.Group(); g.add(m.root); g.position.x = x; x += n === 'shuuyou' ? 1.6 : 1.1; scene.add(g);
  m.root.traverse(o => { if (o.isMesh && !o.userData.isOutlineHull) o.castShadow = true; });
  const face = m.mats && m.mats.face ? new FaceDriver(codeFaceAdapter(m), { seed: 3, blinkPerMin: Q.get('blink') ? 16 : 0.01 }) : null;
  if (face && Q.get('expr')) face.setExpr(Q.get('expr'));
  if (face && Q.get('say')) { face.say(Q.get('say'), +(Q.get('sayDur') || 3)); m.talkingMouth = true; }
  if (face && Q.get('gaze')) { const [gx, gy] = Q.get('gaze').split(',').map(Number); face.lookAt(gx, gy); }
  actors.push({ n, m, g, face, poser: new Poser(m.J, m.rest || {}), t: Q.get('t0') ? +Q.get('t0') : Math.random() * 3 });
}
const tris = actors.map(a => `${a.n}: ${a.m.tris ? Math.round(a.m.tris) : '?'} 三角形`).join('\n');
const rot = +(Q.get('rot') || 0), dist = +(Q.get('dist') || (list.length * 1.2 + 1.5)), cy = +(Q.get('y') || 1.0), cx = +(Q.get('x') || 0);
const pose = Q.get('pose') || 'idle';
// 時間を進めてから撮る（&t=秒：揺れ物・瞬きを落ち着かせる）
for (let i = 0; i < Math.round(+(Q.get('t') || 0) * 60); i++) for (const a of actors) { a.t += 1 / 60; if (a.m.update) a.m.update(1 / 60); if (a.face) a.face.update(1 / 60); }
let t0 = performance.now();
function frame() {
  const t = (performance.now() - t0) / 1000;
  for (const a of actors) {
    a.t += 1 / 60;
    let p;
    const ctx = { st: { name: pose === 'walk' || pose === 'run' || pose === 'idle' ? 'free' : pose, f: 10, atk: { startup: 6, active: 4, recovery: 14 }, step: 0 }, f: 10, w: Q.get('w') || 'none', speed: pose === 'walk' ? 2.2 : pose === 'run' ? 5 : 0, phase: a.t * (pose === 'run' ? 13 : 7.5), time: a.t, aiming: false, state: 'loop', sub: 'walk', t: a.t };
    if (a.n === 'dannoura' || a.n === 'white') p = A.dannouraPose(ctx).pose;
    else if (a.n === 'kiro') p = A.kiroPose(ctx).pose;
    else if (a.n === 'heiten') p = A.heitenPose(ctx).pose;
    else if (a.n === 'shuuyou' && A.shuuyouPose) p = A.shuuyouPose(Object.assign(ctx, { state: 'idle' })).pose;
    else p = A.companionPose({ time: a.t, speed: ctx.speed, phase: ctx.phase }).pose;
    a.poser.apply(p, 0.2);
    if (a.m.weapons && a.m.weapons.bones) { const W = a.m.weapons, hold = Q.get('w') || 'none', on = (o, v) => o && o.scale.setScalar(v ? 1 : 1e-4); on(W.katana, hold === 'katana'); on(W.sayaHilt, hold !== 'katana'); on(W.saya, true); on(W.gun, hold === 'handgun'); on(W.holster, true); on(W.holsterGun, hold !== 'handgun'); on(W.pipe, hold === 'pipe'); on(W.pipeBack, !!Q.get('pipe')); on(W.match, hold === 'matchlock'); on(W.matchBack, false); }
    if (a.face) { if (Q.get('say') && !a.face.talking && a.t > 1) a.face.say(Q.get('say'), +(Q.get('sayDur') || 3)); a.face.update(1 / 60); }
    if (a.m.update) a.m.update(1 / 60);
    a.g.rotation.y = rot + (Q.get('spin') ? t * 0.6 : 0);
  }
  cam.position.set(cx + Math.sin(0) * dist, cy + 0.15, dist); cam.lookAt(cx, cy, 0);
  r.render(scene, cam);
  document.getElementById('info').textContent = `draw ${r.info.render.calls}  tri ${r.info.render.triangles}\n${tris}`;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
</body>
</html>
