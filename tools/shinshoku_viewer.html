<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境界侵食 キャラクター確認</title>
<!-- 開発用：コードで組んだキャラクター／manifest で差し替えたモデルを並べて見る。?c=dannoura&pose=idle&rot=0.4&dist=1.6&y=1.45 -->
<style>html,body{margin:0;height:100%;background:#1a1626;color:#eee;font:13px sans-serif;overflow:hidden}#info{position:fixed;left:8px;top:6px;white-space:pre}</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three-esm/three-0.185.1/three.module.min.js", "three/addons/": "../vendor/three-esm/three-0.185.1/addons/", "@pixiv/three-vrm": "../vendor/three-esm/three-vrm-3.5.5/three-vrm.module.min.js" } }
</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { buildDannoura, buildCompanion, buildKiro, buildHeiten, buildShuuyou, buildCivilian } from '../shinshoku/actor/models.js';
import { Poser } from '../shinshoku/actor/rig.js';
import * as A from '../shinshoku/actor/anim.js';
import { loadManifest, loadCharacter } from '../shinshoku/actor/vrm.js';
const Q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x221c30);
scene.add(new THREE.HemisphereLight(0x8a8ac0, 0x302838, 1.4));
const key = new THREE.DirectionalLight(0xfff0e8, 1.6); key.position.set(2, 4, 3); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0x9a8aff, 1.0); rim.position.set(-3, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 32), new THREE.MeshToonMaterial({ color: 0x3a3446 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
const builders = { dannoura: buildDannoura, companion: buildCompanion, kiro: () => buildKiro(0xd04848), heiten: buildHeiten, shuuyou: buildShuuyou, civilian: () => buildCivilian(3) };
const list = (Q.get('c') || 'dannoura,companion,kiro,heiten,shuuyou').split(',');
const actors = [];
const man = Q.get('manifest') === '1' ? await loadManifest() : null;
let x = -(list.length - 1) * 0.55;
for (const n of list) {
  let m = null;
  if (man && man.characters && man.characters[n] && man.characters[n].file) m = await loadCharacter(man.characters[n]);
  if (!m) m = builders[n]();
  const g = new THREE.Group(); g.add(m.root); g.position.x = x; x += n === 'shuuyou' ? 1.6 : 1.1; scene.add(g);
  m.root.traverse(o => { if (o.isMesh && !o.userData.isOutlineHull) o.castShadow = true; });
  actors.push({ n, m, g, poser: new Poser(m.J, m.rest || {}), t: Math.random() * 3 });
}
const tris = actors.map(a => `${a.n}: ${a.m.tris ? Math.round(a.m.tris) : '?'} 三角形`).join('\n');
const rot = +(Q.get('rot') || 0), dist = +(Q.get('dist') || (list.length * 1.2 + 1.5)), cy = +(Q.get('y') || 1.0), cx = +(Q.get('x') || 0);
const pose = Q.get('pose') || 'idle';
let t0 = performance.now();
function frame() {
  const t = (performance.now() - t0) / 1000;
  for (const a of actors) {
    a.t += 1 / 60;
    let p;
    const ctx = { st: { name: pose === 'walk' || pose === 'run' || pose === 'idle' ? 'free' : pose, f: 10, atk: { startup: 6, active: 4, recovery: 14 }, step: 0 }, f: 10, w: 'katana', speed: pose === 'walk' ? 2.2 : pose === 'run' ? 5 : 0, phase: a.t * (pose === 'run' ? 13 : 7.5), time: a.t, aiming: false, state: 'loop', sub: 'walk', t: a.t };
    if (a.n === 'dannoura') p = A.dannouraPose(ctx).pose;
    else if (a.n === 'kiro') p = A.kiroPose(ctx).pose;
    else if (a.n === 'heiten') p = A.heitenPose(ctx).pose;
    else if (a.n === 'shuuyou' && A.shuuyouPose) p = A.shuuyouPose(Object.assign(ctx, { state: 'idle' })).pose;
    else p = A.companionPose({ time: a.t, speed: ctx.speed, phase: ctx.phase }).pose;
    a.poser.apply(p, 0.2);
    if (a.m.weapons && a.m.weapons.bones) { const W = a.m.weapons; W.katana.scale.setScalar(1); W.sayaHilt.scale.setScalar(1e-4); W.gun.scale.setScalar(1e-4); W.pipe.scale.setScalar(1e-4); W.pipeBack.scale.setScalar(Q.get('pipe') ? 1 : 1e-4); }
    a.g.rotation.y = rot + (Q.get('spin') ? t * 0.6 : 0);
  }
  cam.position.set(cx + Math.sin(0) * dist, cy + 0.15, dist); cam.lookAt(cx, cy, 0);
  r.render(scene, cam);
  document.getElementById('info').textContent = `draw ${r.info.render.calls}  tri ${r.info.render.triangles}\n${tris}`;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
</body>
</html>
