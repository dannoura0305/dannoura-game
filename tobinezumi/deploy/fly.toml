# トビネズミMMO（仮称）— Fly.io の設定（手順は tobinezumi/docs/DEPLOY.md）。
# リポジトリのルートで：
#   fly launch --no-deploy --copy-config --config tobinezumi/deploy/fly.toml --dockerfile tobinezumi/server/Dockerfile
#   fly volumes create tobi_data --size 1 --region nrt --config tobinezumi/deploy/fly.toml
#   fly deploy --config tobinezumi/deploy/fly.toml --dockerfile tobinezumi/server/Dockerfile .
# ★ app の名前と TOBI_ORIGIN は自分のものに書きかえる。

app = "tobinezumi-CHANGE-ME"
primary_region = "nrt"            # 東京
kill_signal = "SIGTERM"           # 位置を保存・バックアップしてから止まる（サーバーは 10 秒で必ず終わる）
kill_timeout = "15s"

[env]
  NODE_ENV = "production"
  TOBI_PORT = "8080"
  TOBI_DATA_DIR = "/data"
  TOBI_BACKUPS = "/data/backups"
  TOBI_BACKUP_HOURS = "1"
  TOBI_BACKUP_KEEP = "48"
  TOBI_TRUST_PROXY = "1"
  # つないでよいページ（GitHub Pages の URL。カンマ区切りで複数）。サーバー自身が配るページはいつでも通る
  TOBI_ORIGIN = "https://CHANGE-ME.github.io"
  TOBI_MAX_CONN_PER_IP = "6"
  TOBI_MSG_PER_IP = "300"
  TOBI_STATS_SEC = "300"
  # TOBI_DEV は入れない（入れると起動しない）

# SQLite とバックアップはボリュームに（マシンを作り直しても消えない）
[[mounts]]
  source = "tobi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # WebSocket で遊ぶので、だれもいなくても止めない（止めると次の人の最初の接続が数秒遅れる。安くしたいなら "stop" にして min_machines_running = 0）
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
