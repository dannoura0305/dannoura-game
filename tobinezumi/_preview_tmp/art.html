<!doctype html><html><body style="background:#3a2a20;margin:0">
<canvas id="c" width="640" height="420" style="width:1280px;height:840px;image-rendering:pixelated"></canvas>
<script type="module">
import * as A from '../client/art.js';
const g=document.getElementById('c').getContext('2d');g.imageSmoothingEnabled=false;
let y=0;
for (const view of ['side','front','back']) {
  let x=0;
  for (const an of ['idle','hop','jump','gather','sleep','climb']) {
    const n=(A.ANIMS[an]).length;
    for(let f=0;f<n;f++){ g.drawImage(A.jerboaFrame('sand',view,an,f),x,y); x+=32; if(x>600)break;}
  }
  y+=34;
}
let x=0;for(const f of A.FURS){g.drawImage(A.jerboaFrame(f.id,'side','idle',0),x,y);g.drawImage(A.jerboaFrame(f.id,'front','idle',0),x+32,y);x+=70;}
y+=40;
for(let k=0;k<3;k++){for(let i=0;i<8;i++)g.drawImage(A.groundTile(k,i,k),i*16,y+k*16);} 
A.drawShrub(g,160,y+20,0);A.drawShrub(g,190,y+20,1);A.drawRock(g,220,y+20,0);A.drawStones(g,250,y+20,0);A.drawTree(g,300,y+64);
A.drawBurrow(g,350,y+10,true);A.drawItem(g,'seed',380,y);A.drawItem(g,'grass',400,y);A.drawItem(g,'pebble',420,y);
y+=70;x=0;
for(const [t,w,h] of [['lamp',1,1],['rug',2,1],['pebble_deco',1,1],['seed_pile',1,1],['dried_flower',1,1],['shelf',2,2],['nestbed',2,1],['storage',2,2]]){g.fillStyle='#3e2616';g.fillRect(x,y,w*16,h*16);A.drawFurniture(g,t,x,y,w,h,0,0,{fill:0.7});x+=w*16+6;}
x=300;for(const t of ['dig','tunnel','room','bed','store','furniture','remove']){A.drawToolIcon(g,t,x,y);x+=18;}
g.drawImage(A.portrait('rust'),480,250);
</script></body></html>
