<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>わかば mapkit：検証マップ（開発用）</title>
<meta name="theme-color" content="#1a1c24">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="mapkit/runtime/style.css">
<!-- three.js は境界侵食と同じ版固定の物（vendor/three-esm/） -->
<script type="importmap">
{ "imports": { "three": "./vendor/three-esm/three-0.185.1/three.module.min.js", "three/addons/": "./vendor/three-esm/three-0.185.1/addons/" } }
</script>
</head>
<body>
<canvas id="mk-canvas"></canvas>
<div id="mk-boot">読み込み中……</div>
<div id="mk-hud" hidden>
  <div id="mk-panel">
    <div class="mk-title">山の廃村（検証マップ・写実の試験）<small>開発用</small></div>
    <div id="mk-goal"></div><div id="mk-dist"></div><div id="mk-where"></div>
    <ol id="mk-list"></ol>
    <label class="mk-sel">画質 <select id="mk-preset"></select></label>
  </div>
  <div id="mk-arrow" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3 L33 30 L20 23 L7 30 Z" fill="#9fe6ff" stroke="#08202a" stroke-width="2"/></svg></div>
  <div id="mk-msg"></div>
  <div id="mk-help">WASD：移動／Shift：走る／マウス：視点（クリックで固定）／E：戸を開け閉め／L：灯り／V：一人称・三人称／N：次の目的地／Esc・P：一時停止。光の線と柱が道案内です。</div>
  <div id="mk-prompt" hidden></div>
  <div id="mk-threat"></div>
  <pre id="mk-perf"></pre>
</div>
<div id="mk-fade"></div>
<div id="mk-pause" hidden><div class="box">
  <h2>一時停止</h2>
  <button id="mk-resume">再開する</button>
  <button id="mk-respawn">最後のチェックポイントから</button>
  <button id="mk-restart">最初からやり直す</button>
  <label>画質 <select id="mk-pause-preset"></select></label>
  <label>日の高さ <select id="mk-pause-sun"><option value="">地図の値（9°）</option><option value="6">6°（とても低い）</option><option value="12">12°</option><option value="18">18°</option><option value="28">28°（昼に近い）</option></select></label>
  <label>敵を出す <input type="checkbox" id="mk-pause-enemy"></label>
  <label>音 <input type="checkbox" id="mk-pause-audio"></label>
  <small style="opacity:.6">画質・日の高さ・敵は読み直します</small>
</div></div>
<noscript><p style="color:#fff;padding:2em">JavaScript を有効にしてください。</p></noscript>
<script type="module" src="mapkit/runtime/main.js"></script>
</body>
</html>
